name: CI
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build SkyPilot.sln -c Release
      - run: dotnet test tests/SkyPilot.Core.Tests -c Release --no-build

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/SkyPilot.Core.Tests

  xplane-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S xplane-plugin -B build/xp -A x64
      - name: Build
        run: cmake --build build/xp --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          cmake --install build/xp --config Release --prefix build/xp/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/xp/dist/SkyPilot/win_x64/SkyPilot.xpl)) { throw "SkyPilot.xpl missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPilot-XPlanePlugin
          path: build/xp/dist
