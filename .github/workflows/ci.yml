name: CI
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # No MSFS SDK on CI: SkyPilot.SimConnect builds against tools/SimConnectStub.
      - run: dotnet build SkyPilot.sln -c Release
      - run: dotnet test tests/SkyPilot.Core.Tests -c Release --no-build

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/SkyPilot.Core.Tests
