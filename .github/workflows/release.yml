name: Release

# Builds a ready-to-run SkyPilot for Windows x64 (self-contained, no .NET install needed).
#  - Every push to main, pull request and manual run: the package is attached to the run as an artifact.
#  - Tags v*: the zip is also published as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/SkyPilot.Core.Tests -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v'); $name = "SkyPilot-$v-win-x64"
          } else {
            $v = '0.1.0'; $name = "SkyPilot-$v-build${{ github.run_number }}-win-x64"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/SkyPilot.App -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} -o publish/SkyPilot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path publish/SkyPilot/SkyPilot.exe)) { throw "SkyPilot.exe missing" }

      # SimConnect.dll is part of the MSFS SDK and has no public download. SkyPilot finds it at run
      # time next to SkyPilot.exe or in the installed SDK. If the maintainers attached it to a DRAFT
      # release named "msfs-sdk", it is bundled so users don't need the SDK.
      - name: Bundle SimConnect.dll (optional)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" -Headers $headers |
            Where-Object { $_.name -eq 'msfs-sdk' -or $_.tag_name -eq 'msfs-sdk' } | Select-Object -First 1
          $asset = $release.assets | Where-Object { $_.name -eq 'SimConnect.dll' } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest $asset.url -Headers ($headers + @{ Accept = 'application/octet-stream' }) `
              -OutFile publish/SkyPilot/SimConnect.dll -UseBasicParsing
            Write-Host "SimConnect.dll bundled"
          } else {
            Write-Host "::notice::SimConnect.dll not bundled (no msfs-sdk draft release). SkyPilot will look for it next to SkyPilot.exe or in the MSFS SDK."
          }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/SkyPilot -DestinationPath "${{ steps.version.outputs.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: publish/SkyPilot

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.name }}.zip
          generate_release_notes: true
