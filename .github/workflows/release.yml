name: Release

# Builds a ready-to-run SkyPilot for Windows x64 (self-contained, no .NET install needed).
#  - Every push to main, pull request and manual run: the package is attached to the run as an artifact.
#  - Every run also builds the installer SkyPilot-Setup-<version>.exe (Inno Setup, installer/SkyPilot.iss).
#  - Every run also builds the X-Plane plugin (xplane-plugin/), bundled as XPlanePlugin/SkyPilot/ in the package.
#  - Tags v*: the installer, the zip and the X-Plane plugin zip are published as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/SkyPilot.Core.Tests -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v'); $name = "SkyPilot-$v-win-x64"
          } else {
            $v = '0.1.0'; $name = "SkyPilot-$v-build${{ github.run_number }}-win-x64"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/SkyPilot.App -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} -o publish/SkyPilot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path publish/SkyPilot/SkyPilot.exe)) { throw "SkyPilot.exe missing" }

      # SimConnect.dll from the MSFS SDK (redistributed with SkyPilot, see third_party/SimConnect).
      - name: Bundle SimConnect.dll
        shell: pwsh
        run: Copy-Item third_party/SimConnect/SimConnect.dll publish/SkyPilot/

      # X-Plane plugin (xplane-plugin/, C++/CMake). Shipped inside the app folder as
      # XPlanePlugin/SkyPilot/ (copy that folder to X-Plane/Resources/plugins/) and as its own zip.
      - name: Build X-Plane plugin
        shell: pwsh
        run: |
          cmake -S xplane-plugin -B build/xp -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/xp --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build/xp --config Release --prefix publish/SkyPilot/XPlanePlugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path publish/SkyPilot/XPlanePlugin/SkyPilot/win_x64/SkyPilot.xpl)) { throw "SkyPilot.xpl missing" }
          Compress-Archive -Path publish/SkyPilot/XPlanePlugin/SkyPilot -DestinationPath "SkyPilot-XPlanePlugin-${{ steps.version.outputs.version }}.zip"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/SkyPilot -DestinationPath "${{ steps.version.outputs.name }}.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\publish\SkyPilot" "/DOutputDir=$PWD\dist" installer\SkyPilot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\SkyPilot-Setup-${{ steps.version.outputs.version }}.exe")) { throw "installer missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: publish/SkyPilot

      - uses: actions/upload-artifact@v4
        with:
          name: SkyPilot-Setup-${{ steps.version.outputs.version }}
          path: dist/SkyPilot-Setup-${{ steps.version.outputs.version }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SkyPilot-XPlanePlugin-${{ steps.version.outputs.version }}
          path: publish/SkyPilot/XPlanePlugin

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SkyPilot-Setup-${{ steps.version.outputs.version }}.exe
            ${{ steps.version.outputs.name }}.zip
            SkyPilot-XPlanePlugin-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
